[project]
name = "immich-alben"
version = "0.1.0"
description = "Sync NAS folder structure to Immich albums via API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
immich-alben = "immich_alben.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/immich_alben"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
