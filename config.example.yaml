immich:
  base_url: "http://192.168.1.50:2283"

library_roots:
  - "/mnt/photos"

patterns:
  - "{root}/{year}/{album}"
  - "{root}/{year}/{album}/{*}"

state_file: "/data/state.json"

logging:
  level: "INFO"

# Optionale Geo-Verfeinerung: Bilder mit EXIF-GPS, die innerhalb des Radius
# einer konfigurierten Location liegen, landen in einem feineren Sub-Album
# "{album} – {location}". Bilder ohne Treffer bleiben im Parent-Album.
# Diesen ganzen Block weglassen, um Geo zu deaktivieren.
